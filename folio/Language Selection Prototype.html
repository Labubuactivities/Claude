<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Language Selection – Design Exploration</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      background: #0f1419;
      color: #e5e5e7;
      padding: 20px;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    
    .header {
      margin-bottom: 40px;
    }
    
    .header h1 {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #ffffff;
    }
    
    .header p {
      font-size: 16px;
      color: #8b92a6;
    }
    
    .exploration {
      margin-bottom: 60px;
    }
    
    .exploration-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 24px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .exploration-title .label {
      background: rgba(139, 92, 246, 0.2);
      color: #a78bfa;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
    }
    
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr));
      gap: 20px;
    }
    
    /* ── STYLE 1: Vertical Card (Reference Style) ── */
    .card-vertical {
      background: #1a1f2b;
      border: 1px solid #2d3544;
      border-radius: 20px;
      padding: 32px 24px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 0.1, 0.64, 0.99);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    
    .card-vertical:hover {
      border-color: #8b5cf6;
      background: #222635;
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(139, 92, 246, 0.15);
    }
    
    .card-vertical.selected {
      background: rgba(139, 92, 246, 0.12);
      border-color: #8b5cf6;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2), 0 12px 32px rgba(139, 92, 246, 0.15);
    }
    
    .flag-container {
      margin-bottom: 20px;
    }
    
    .flag-large {
      width: 100px;
      height: 80px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      background: transparent;
      overflow: hidden;
    }
    
    .card-vertical .lang-name {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #ffffff;
    }
    
    .card-vertical .lang-count {
      font-size: 14px;
      color: #8b92a6;
    }
    
    /* ── STYLE 2: Horizontal Compact ── */
    .card-horizontal {
      background: #1a1f2b;
      border: 1.5px solid #2d3544;
      border-radius: 16px;
      padding: 18px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 0.1, 0.64, 0.99);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    
    .card-horizontal:hover {
      border-color: #8b5cf6;
      background: #222635;
      transform: translateX(4px);
      box-shadow: 0 8px 20px rgba(139, 92, 246, 0.12);
    }
    
    .card-horizontal.selected {
      background: rgba(139, 92, 246, 0.1);
      border-color: #8b5cf6;
      box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
    }
    
    .flag-medium {
      width: 60px;
      height: 48px;
      border-radius: 12px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.25);
      background: transparent;
      overflow: hidden;
    }
    
    .card-content {
      flex: 1;
    }
    
    .card-content .lang-name {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
    }
    
    .card-content .lang-sub {
      font-size: 13px;
      color: #8b92a6;
      margin-top: 2px;
    }
    
    /* ── STYLE 3: Minimal Pill ── */
    .card-pill {
      background: linear-gradient(135deg, #1a1f2b 0%, #222635 100%);
      border: 1px solid #3d4556;
      border-radius: 99px;
      padding: 14px 20px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 0.1, 0.64, 0.99);
      display: flex;
      align-items: center;
      gap: 12px;
      width: fit-content;
    }
    
    .card-pill:hover {
      border-color: #8b5cf6;
      background: linear-gradient(135deg, #222635 0%, #2d3544 100%);
      box-shadow: 0 8px 20px rgba(139, 92, 246, 0.12);
    }
    
    .card-pill.selected {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.15) 0%, rgba(139, 92, 246, 0.08) 100%);
      border-color: #8b5cf6;
      box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
    }
    
    .flag-small {
      width: 44px;
      height: 35px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      background: transparent;
      overflow: hidden;
    }
    
    .card-pill .lang-name {
      font-size: 15px;
      font-weight: 500;
      color: #ffffff;
      white-space: nowrap;
    }
    
    /* ── STYLE 4: Featured (Full Bleed) ── */
    /* ── HERO card style ── */

    @property --mx { syntax: '<percentage>'; inherits: false; initial-value: 20%; }
    @property --my { syntax: '<percentage>'; inherits: false; initial-value: 50%; }

    .card-featured {
      background: var(--hero-bg, #1a1f2b);
      border: 1.5px solid var(--hero-border, rgba(255,255,255,0.07));
      border-radius: 20px;
      padding: 20px 24px;
      cursor: pointer;
      transition: --mx 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94), --my 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94), border-color 0.28s, box-shadow 0.28s, transform 0.28s;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 24px;
    }

    .card-featured::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 90% at var(--mx, 20%) var(--my, 50%), var(--hero-glow-color, transparent), transparent);
      pointer-events: none;
      border-radius: inherit;
      transition: opacity 0.2s ease;
      opacity: 0;
      z-index: 0;
    }

    .card-featured:hover {
      border-color: var(--hero-accent, rgba(255,255,255,0.18));
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.25);
    }

    .card-featured:hover::after { opacity: 1; }
    .card-featured.selected::after { opacity: 0.6; }

    .card-featured.selected {
      border-color: var(--hero-accent, rgba(255,255,255,0.4));
      box-shadow: 0 0 0 1.5px var(--hero-accent, rgba(255,255,255,0.4)), 0 16px 40px rgba(0,0,0,0.3);
      transform: translateY(-1px);
    }

    .featured-flag {
      width: 160px;
      height: 128px;
      flex: 0 0 160px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px rgba(0,0,0,0.35);
      position: relative;
      z-index: 1;
    }

    .card-featured-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
      z-index: 1;
    }

    .card-featured .lang-name {
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }
    
    .card-featured .lang-description {
      font-size: 16px;
      color: #8b92a6;
      line-height: 1.5;
    }
    
    /* ── Tweaks Panel ── */
    .tweaks-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
    }
    
    .tweaks-panel {
      background: #1a1f2b;
      border: 1px solid #3d4556;
      border-radius: 14px;
      padding: 18px;
      max-width: 280px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }
    
    .tweaks-panel h3 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #8b92a6;
      margin-bottom: 12px;
    }
    
    .tweak-group {
      margin-bottom: 14px;
    }
    
    .tweak-label {
      font-size: 12px;
      color: #8b92a6;
      margin-bottom: 6px;
      display: block;
    }
    
    .tweak-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    
    .tweak-btn {
      background: #2d3544;
      border: 1px solid #3d4556;
      color: #8b92a6;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    
    .tweak-btn:hover {
      border-color: #8b5cf6;
      color: #a78bfa;
    }
    
    .tweak-btn.active {
      background: #8b5cf6;
      border-color: #8b5cf6;
      color: #ffffff;
    }
    
    .divider {
      height: 1px;
      background: #2d3544;
      margin: 12px 0;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const LANGUAGES = [
      { code: 'fa', name: 'Persian', native: 'فارسی', nativeLatin: 'Fārsī', description: 'Built for slow, careful reading' },
      { code: 'tr', name: 'Turkish', native: 'Türkçe', nativeLatin: 'Türkçe', description: 'Geometry and grace in equal measure' },
      { code: 'es', name: 'Spanish', native: 'Español', nativeLatin: 'Español', description: 'Sunlight on the page' }
    ];

    const FLAG_SVGS = {
      fa: '<svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg"><defs><filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-opacity="0.25"/></filter></defs><g filter="url(#shadow)"><rect x="5" y="5" width="90" height="70" rx="10" fill="#1aa856"/><rect x="5" y="28.33" width="90" height="23.34" fill="#ffffff"/><rect x="5" y="51.67" width="90" height="23.33" fill="#d40000"/></g></svg>',
      tr: '<svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg"><defs><filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-opacity="0.25"/></filter></defs><g filter="url(#shadow)"><rect x="5" y="5" width="90" height="70" rx="10" fill="#f31f1b"/><circle cx="45" cy="40" r="22" fill="#ffffff"/><circle cx="55" cy="40" r="19.4" fill="#f31f1b"/><g transform="translate(64,40)"><path d="M0,-10 L2.35,-3.24 L9.51,-3.09 L3.80,1.24 L5.88,8.09 L0,4 L-5.88,8.09 L-3.80,1.24 L-9.51,-3.09 L-2.35,-3.24 Z" fill="#ffffff"/></g></g></svg>',
      es: '<svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg"><defs><filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-opacity="0.25"/></filter></defs><g filter="url(#shadow)"><rect x="5" y="5" width="90" height="70" rx="10" fill="#ee2420"/><rect x="5" y="24" width="90" height="32" fill="#fed316"/><g transform="translate(30,39)"><rect x="-11" y="-3" width="4" height="10" rx="1.2" fill="#ffffff"/><rect x="-13" y="-6" width="8" height="3" rx="1" fill="#ffffff"/><rect x="7" y="-3" width="4" height="10" rx="1.2" fill="#ffffff"/><rect x="5" y="-6" width="8" height="3" rx="1" fill="#ffffff"/><path d="M-6,-6 a1.5,1.5 0 0 1 1.5,-1.5 h9 a1.5,1.5 0 0 1 1.5,1.5 v7 Q 6,7 0,9 Q -6,7 -6,2 Z" fill="#ee2420"/></g></g></svg>'
    };

    function LanguageSelectionExploration() {
      const [selectedVertical, setSelectedVertical] = useState(null);
      const [selectedHorizontal, setSelectedHorizontal] = useState(null);
      const [selectedPill, setSelectedPill] = useState(null);
      const [selectedFeatured, setSelectedFeatured] = useState(null);
      const [spacing, setSpacing] = useState('comfortable');
      const [cardSize, setCardSize] = useState('medium');
      const [flagStyle, setFlagStyle] = useState('modern');
      const [flagSaturation, setFlagSaturation] = useState(100);
      const [flagRounding, setFlagRounding] = useState(14);

      const getGap = () => spacing === 'tight' ? '12px' : spacing === 'comfortable' ? '20px' : '32px';
      const getGridColumns = () => {
        if (cardSize === 'small') return 'repeat(auto-fit, minmax(200px, 1fr))';
        if (cardSize === 'medium') return 'repeat(auto-fit, minmax(260px, 1fr))';
        return 'repeat(auto-fit, minmax(320px, 1fr))';
      };

      const getFlagSvg = (lang) => {
        const saturationFilter = `saturate(${flagSaturation / 100})`;
        return `<g style="filter: ${saturationFilter};">${FLAG_SVGS[lang].replace(/<svg[^>]*>|<\/svg>/g, '').replace(/rx="10"/g, `rx="${flagRounding}"`)}</g>`;
      };

      return (
        <div className="container">
          <div className="header">
            <h1>Language Selection Cards</h1>
            <p>Exploring multiple design directions for the language learning onboarding</p>
          </div>

          {/* Style 1: Vertical Cards */}
          <div className="exploration">
            <div className="exploration-title">
              Vertical Cards
              <span className="label">Reference Style</span>
            </div>
            <div className="cards-grid" style={{ gap: getGap(), gridTemplateColumns: getGridColumns() }}>
              {LANGUAGES.map(lang => (
                <div
                  key={lang.code}
                  className={`card-vertical ${selectedVertical === lang.code ? 'selected' : ''}`}
                  onClick={() => setSelectedVertical(lang.code)}
                >
                  <div className="flag-container">
                    <div className="flag-large" style={{ backgroundColor: 'transparent' }}>
                      <svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg" style={{ width: '100%', height: '100%', filter: `saturate(${flagSaturation / 100})` }}>
                        <defs><filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="2" floodOpacity="0.25"/></filter></defs>
                        {lang.code === 'fa' && (
                          <g filter="url(#shadow)">
                            <rect x="5" y="5" width="90" height="70" rx={flagRounding} fill="#1aa856"/>
                            <rect x="5" y="5" width="90" height="23.33" rx={flagRounding} fill="#1aa856"/>
                            <rect x="5" y="28.33" width="90" height="23.34" fill="#ffffff"/>
                            <rect x="5" y="51.67" width="90" height="23.33" rx={flagRounding} fill="#d40000"/>
                          </g>
                        )}
                        {lang.code === 'tr' && (
                          <g filter="url(#shadow)">
                            <rect x="5" y="5" width="90" height="70" rx={flagRounding} fill="#d91e1e"/>
                            <circle cx="28" cy="40" r="12" fill="#ffffff"/>
                            <circle cx="30" cy="40" r="9" fill="#d91e1e"/>
                            <g transform="translate(48, 40)"><path d="M0,-10 L2.5,-4 L9,-3 L4,2 L6,10 L0,6 L-6,10 L-4,2 L-9,-3 L-2.5,-4 Z" fill="#ffffff"/></g>
                          </g>
                        )}
                        {lang.code === 'es' && (
                          <g filter="url(#shadow)">
                            <rect x="5" y="5" width="90" height="70" rx={flagRounding} fill="#c60c30"/>
                            <rect x="5" y="20" width="90" height="40" rx="6" fill="#ffc400"/>
                            <g transform="translate(50, 40)">
                              <circle cx="0" cy="0" r="6" fill="#c60c30"/>
                              <rect x="-1.5" y="-10" width="3" height="20" fill="#c60c30"/>
                              <rect x="-10" y="-1.5" width="20" height="3" fill="#c60c30"/>
                              <circle cx="0" cy="0" r="3" fill="#ffc400" opacity="0.7"/>
                            </g>
                          </g>
                        )}
                      </svg>
                    </div>
                  </div>
                  <div className="lang-name">{lang.name}</div>
                  <div className="lang-count">42.5M learners</div>
                </div>
              ))}
            </div>
          </div>

          {/* Style 2: Horizontal Compact */}
          <div className="exploration">
            <div className="exploration-title">
              Horizontal Compact
              <span className="label">Dense & Efficient</span>
            </div>
            <div className="cards-grid" style={{ gap: getGap(), gridTemplateColumns: getGridColumns() }}>
              {LANGUAGES.map(lang => (
                <div
                  key={lang.code}
                  className={`card-horizontal ${selectedHorizontal === lang.code ? 'selected' : ''}`}
                  onClick={() => setSelectedHorizontal(lang.code)}
                >
                  <div className="flag-medium" style={{ backgroundColor: 'transparent' }}>
                    <svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg" style={{ width: '100%', height: '100%', filter: `saturate(${flagSaturation / 100})` }}>
                      <defs><filter id="shadow2"><feDropShadow dx="0" dy="3" stdDeviation="2" floodOpacity="0.25"/></filter></defs>
                      {lang.code === 'fa' && (
                        <g filter="url(#shadow2)">
                          <rect x="5" y="5" width="90" height="70" rx={flagRounding} fill="#1aa856"/>
                          <rect x="5" y="5" width="90" height="23.33" rx={flagRounding} fill="#1aa856"/>
                          <rect x="5" y="28.33" width="90" height="23.34" fill="#ffffff"/>
                          <rect x="5" y="51.67" width="90" height="23.33" rx={flagRounding} fill="#d40000"/>
                        </g>
                      )}
                      {lang.code === 'tr' && (
                        <g filter="url(#shadow2)">
                          <rect x="5" y="5" width="90" height="70" rx={flagRounding} fill="#d91e1e"/>
                          <circle cx="28" cy="40" r="12" fill="#ffffff"/>
                          <circle cx="30" cy="40" r="9" fill="#d91e1e"/>
                          <g transform="translate(48, 40)"><path d="M0,-10 L2.5,-4 L9,-3 L4,2 L6,10 L0,6 L-6,10 L-4,2 L-9,-3 L-2.5,-4 Z" fill="#ffffff"/></g>
                        </g>
                      )}
                      {lang.code === 'es' && (
                        <g filter="url(#shadow2)">
                          <rect x="5" y="5" width="90" height="70" rx={flagRounding} fill="#c60c30"/>
                          <rect x="5" y="20" width="90" height="40" rx="6" fill="#ffc400"/>
                          <g transform="translate(50, 40)">
                            <circle cx="0" cy="0" r="6" fill="#c60c30"/>
                            <rect x="-1.5" y="-10" width="3" height="20" fill="#c60c30"/>
                            <rect x="-10" y="-1.5" width="20" height="3" fill="#c60c30"/>
                            <circle cx="0" cy="0" r="3" fill="#ffc400" opacity="0.7"/>
                          </g>
                        </g>
                      )}
                    </svg>
                  </div>
                  <div className="card-content">
                    <div className="lang-name">{lang.name}</div>
                    <div className="lang-sub">{lang.native}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* Style 3: Minimal Pills */}
          <div className="exploration">
            <div className="exploration-title">
              Minimal Pills
              <span className="label">Compact & Playful</span>
            </div>
            <div style={{ display: 'flex', gap: getGap(), flexWrap: 'wrap' }}>
              {LANGUAGES.map(lang => (
                <div
                  key={lang.code}
                  className={`card-pill ${selectedPill === lang.code ? 'selected' : ''}`}
                  onClick={() => setSelectedPill(lang.code)}
                >
                  <div className="flag-small" style={{ backgroundColor: 'transparent' }}>
                    <svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg" style={{ width: '100%', height: '100%', filter: `saturate(${flagSaturation / 100})` }}>
                      <defs><filter id="shadow4"><feDropShadow dx="0" dy="3" stdDeviation="2" floodOpacity="0.25"/></filter></defs>
                      {lang.code === 'fa' && (
                        <g filter="url(#shadow4)">
                          <rect x="5" y="5" width="90" height="70" rx={flagRounding} fill="#1aa856"/>
                          <rect x="5" y="5" width="90" height="23.33" rx={flagRounding} fill="#1aa856"/>
                          <rect x="5" y="28.33" width="90" height="23.34" fill="#ffffff"/>
                          <rect x="5" y="51.67" width="90" height="23.33" rx={flagRounding} fill="#d40000"/>
                        </g>
                      )}
                      {lang.code === 'tr' && (
                        <g filter="url(#shadow4)">
                          <rect x="5" y="5" width="90" height="70" rx={flagRounding} fill="#d91e1e"/>
                          <circle cx="28" cy="40" r="12" fill="#ffffff"/>
                          <circle cx="30" cy="40" r="9" fill="#d91e1e"/>
                          <g transform="translate(48, 40)"><path d="M0,-10 L2.5,-4 L9,-3 L4,2 L6,10 L0,6 L-6,10 L-4,2 L-9,-3 L-2.5,-4 Z" fill="#ffffff"/></g>
                        </g>
                      )}
                      {lang.code === 'es' && (
                        <g filter="url(#shadow4)">
                          <rect x="5" y="5" width="90" height="70" rx={flagRounding} fill="#c60c30"/>
                          <rect x="5" y="20" width="90" height="40" rx="6" fill="#ffc400"/>
                          <g transform="translate(50, 40)">
                            <circle cx="0" cy="0" r="6" fill="#c60c30"/>
                            <rect x="-1.5" y="-10" width="3" height="20" fill="#c60c30"/>
                            <rect x="-10" y="-1.5" width="20" height="3" fill="#c60c30"/>
                            <circle cx="0" cy="0" r="3" fill="#ffc400" opacity="0.7"/>
                          </g>
                        </g>
                      )}
                    </svg>
                  </div>
                  <div className="lang-name">{lang.name}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Style 4: Featured */}
          <div className="exploration">
            <div className="exploration-title">
              Featured (Hero Style)
              <span className="label">Premium & Spacious</span>
            </div>
            <div className="cards-grid" style={{ gap: getGap(), gridTemplateColumns: '1fr' }}>
              {LANGUAGES.map(lang => {
                const HERO_COLORS = {
                  fa: { bg: 'rgba(26,168,86,0.08)', border: 'rgba(26,168,86,0.35)', accent: '#1aa856', glowColor: 'rgba(26,168,86,0.18)' },
                  tr: { bg: 'rgba(243,31,27,0.08)', border: 'rgba(243,31,27,0.35)', accent: '#f31f1b', glowColor: 'rgba(243,31,27,0.2)' },
                  es: { bg: 'rgba(238,36,32,0.08)', border: 'rgba(254,211,22,0.35)', accent: '#fed316', glowColor: 'rgba(254,211,22,0.15)' }
                };
                const hc = HERO_COLORS[lang.code];
                const cardRefCallback = (node) => {
                  if (!node) return;
                  node.onmousemove = (e) => {
                    const r = node.getBoundingClientRect();
                    node.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100).toFixed(1) + '%');
                    node.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100).toFixed(1) + '%');
                  };
                  node.onmouseleave = () => { node.style.setProperty('--mx', '20%'); node.style.setProperty('--my', '50%'); };
                  node.ontouchmove = (e) => {
                    const r = node.getBoundingClientRect();
                    const t = e.touches[0];
                    node.style.setProperty('--mx', ((t.clientX - r.left) / r.width * 100).toFixed(1) + '%');
                    node.style.setProperty('--my', ((t.clientY - r.top) / r.height * 100).toFixed(1) + '%');
                  };
                };
                return (
                  <div
                    key={lang.code}
                    ref={cardRefCallback}
                    className={`card-featured ${selectedFeatured === lang.code ? 'selected' : ''}`}
                    onClick={() => setSelectedFeatured(lang.code)}
                    style={{ '--hero-bg': `linear-gradient(120deg, ${hc.bg} 0%, transparent 60%), #1a1f2b`, '--hero-border': hc.border, '--hero-accent': hc.accent, '--hero-glow-color': hc.glowColor }}
                  >
                  <div className="featured-flag" style={{ backgroundColor: 'transparent' }}>
                    <svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg" style={{ width: '100%', height: '100%', filter: `saturate(${flagSaturation / 100})` }}>
                      <defs><filter id="shadow3"><feDropShadow dx="0" dy="3" stdDeviation="2" floodOpacity="0.25"/></filter></defs>
                      {lang.code === 'fa' && (
                        <g filter="url(#shadow3)">
                          <clipPath id="clip-fa-f"><rect x="5" y="5" width="90" height="70" rx={flagRounding}/></clipPath>
                          <g clipPath="url(#clip-fa-f)">
                            <rect x="5" y="5" width="90" height="23.33" fill="#1aa856"/>
                            <rect x="5" y="28.33" width="90" height="23.34" fill="#ffffff"/>
                            <rect x="5" y="51.67" width="90" height="23.33" fill="#d40000"/>
                          </g>
                          <rect x="5" y="5" width="90" height="70" rx={flagRounding} fill="none" stroke="rgba(0,0,0,0.06)" strokeWidth="1"/>
                        </g>
                      )}
                      {lang.code === 'tr' && (
                        <g filter="url(#shadow3)">
                          <clipPath id="clip-tr-f"><rect x="5" y="5" width="90" height="70" rx={flagRounding}/></clipPath>
                          <g clipPath="url(#clip-tr-f)">
                            <rect x="5" y="5" width="90" height="70" fill="#f31f1b"/>
                            <circle cx="45" cy="40" r="22" fill="#ffffff"/>
                            <circle cx="55" cy="40" r="19.4" fill="#f31f1b"/>
                            <g transform="translate(64,40)">
                              <path d="M0,-10 L2.35,-3.24 L9.51,-3.09 L3.80,1.24 L5.88,8.09 L0,4 L-5.88,8.09 L-3.80,1.24 L-9.51,-3.09 L-2.35,-3.24 Z" fill="#ffffff"/>
                            </g>
                          </g>
                          <rect x="5" y="5" width="90" height="70" rx={flagRounding} fill="none" stroke="rgba(0,0,0,0.06)" strokeWidth="1"/>
                        </g>
                      )}
                      {lang.code === 'es' && (
                        <g filter="url(#shadow3)">
                          <clipPath id="clip-es-f"><rect x="5" y="5" width="90" height="70" rx={flagRounding}/></clipPath>
                          <g clipPath="url(#clip-es-f)">
                            <rect x="5" y="5" width="90" height="70" fill="#ee2420"/>
                            <rect x="5" y="24" width="90" height="32" fill="#fed316"/>
                            <g transform="translate(30,39)">
                              <rect x="-11" y="-3" width="4" height="10" rx="1.2" fill="#ffffff"/>
                              <rect x="-13" y="-6" width="8" height="3" rx="1" fill="#ffffff"/>
                              <rect x="7" y="-3" width="4" height="10" rx="1.2" fill="#ffffff"/>
                              <rect x="5" y="-6" width="8" height="3" rx="1" fill="#ffffff"/>
                              <path d="M-6,-6 a1.5,1.5 0 0 1 1.5,-1.5 h9 a1.5,1.5 0 0 1 1.5,1.5 v7 Q 6,7 0,9 Q -6,7 -6,2 Z" fill="#ee2420"/>
                            </g>
                          </g>
                          <rect x="5" y="5" width="90" height="70" rx={flagRounding} fill="none" stroke="rgba(0,0,0,0.06)" strokeWidth="1"/>
                        </g>
                      )}
                    </svg>
                  </div>
                  <div className="card-featured-body">
                    <div className="lang-name">{lang.name}</div>
                    <div className="lang-description" style={{ fontSize: '16px', color: 'rgba(255,255,255,0.45)', marginTop: '2px' }}>{lang.native}</div>
                  </div>
                </div>
                );
              })}
            </div>
          </div>

          {/* Tweaks Panel */}
          <div className="tweaks-container">
            <div className="tweaks-panel">
              <h3>Tweaks</h3>
              
              <div className="tweak-group">
                <label className="tweak-label">Card Spacing</label>
                <div className="tweak-buttons">
                  {['tight', 'comfortable', 'spacious'].map(s => (
                    <button
                      key={s}
                      className={`tweak-btn ${spacing === s ? 'active' : ''}`}
                      onClick={() => setSpacing(s)}
                    >
                      {s}
                    </button>
                  ))}
                </div>
              </div>
              
              <div className="divider"></div>
              
              <div className="tweak-group">
                <label className="tweak-label">Flag Saturation</label>
                <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
                  <input
                    type="range"
                    min="0"
                    max="150"
                    value={flagSaturation}
                    onChange={(e) => setFlagSaturation(parseInt(e.target.value))}
                    style={{ flex: 1, cursor: 'pointer' }}
                  />
                  <span style={{ fontSize: '12px', color: '#8b92a6', minWidth: '30px' }}>{flagSaturation}%</span>
                </div>
              </div>
              
              <div className="tweak-group">
                <label className="tweak-label">Flag Rounding</label>
                <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
                  <input
                    type="range"
                    min="0"
                    max="20"
                    value={flagRounding}
                    onChange={(e) => setFlagRounding(parseInt(e.target.value))}
                    style={{ flex: 1, cursor: 'pointer' }}
                  />
                  <span style={{ fontSize: '12px', color: '#8b92a6', minWidth: '30px' }}>{flagRounding}px</span>
                </div>
              </div>
              
              <div className="tweak-group">
                <label className="tweak-label">Card Size</label>
                <div className="tweak-buttons">
                  {['small', 'medium', 'large'].map(s => (
                    <button
                      key={s}
                      className={`tweak-btn ${cardSize === s ? 'active' : ''}`}
                      onClick={() => setCardSize(s)}
                    >
                      {s}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<LanguageSelectionExploration />);
  </script>
</body>
</html>
